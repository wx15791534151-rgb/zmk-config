---
# ZMK 构建矩阵
# ZMK 2025-12 之后 board 写作 nice_nano//zmk（旧写法 nice_nano_v2 已废弃）
include:
  # 4x4 矩阵左手小键盘（正式版）
  - board: nice_nano//zmk
    shield: leftpad
    artifact-name: leftpad

  # 12 键直连版（保留，可用于对比测试）
  - board: nice_nano//zmk
    shield: numpad12
    artifact-name: numpad12

  # 清空蓝牙配对信息（连不上电脑时刷这个）
  - board: nice_nano//zmk
    shield: settings_reset
    artifact-name: settings_reset
